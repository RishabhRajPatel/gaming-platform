name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Rummy Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rummy
          POSTGRES_PASSWORD: rummy
          POSTGRES_DB: rummy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rummy"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rummy:rummy@localhost:5432/rummy_test
      SECRET_KEY: ci-secret
      REAL_MONEY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        working-directory: rummy/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint
        working-directory: rummy/backend
        run: ruff check app tests
      - name: Test
        working-directory: rummy/backend
        run: pytest -q

  frontend:
    name: Rummy Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rummy/frontend/package-lock.json
      - name: Install
        working-directory: rummy/frontend
        run: npm ci || npm install
      - name: Lint
        working-directory: rummy/frontend
        run: npm run lint --if-present
      - name: Type-check & build
        working-directory: rummy/frontend
        run: npm run build
